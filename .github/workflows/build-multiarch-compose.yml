name: Build & Push multi-arch (compose + bake)

on:
  push:
    branches: [ loesungen ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service-dir:
          - LA_347_4010_HalloContainer_L
          # hier alle Ordner mit docker-compose.yml eintragen

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          install: true

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME_M347 }}
          password: ${{ secrets.DOCKERHUB_TOKEN_M347 }}

      - name: Build & push via docker buildx bake
        working-directory: ./${{ matrix.service-dir }}
        run: |
          docker buildx bake \
            --file docker-compose.yml \
            --push
