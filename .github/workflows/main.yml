name: Top-Level-Ordner als ZIP

on:
  push:
    branches:
      - aufgaben   # anpassen, falls nötig

jobs:
  zip-top-level-dirs:
    runs-on: ubuntu-latest

    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4

      - name: ZIPs für alle Top-Level-Ordner erstellen
        run: |
          mkdir -p dist
          for d in */ ; do
            # bestimmte Ordner überspringen (Beispiele)
            case "$d" in
              ".git/"|".github/"|"dist/") continue ;;
            esac

            dirname="${d%/}"
            echo "Erstelle ZIP für: $dirname"
            zip -r "dist/${dirname}.zip" "$dirname"
          done

      - name: ZIPs als Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: alle-ordner-zips
          path: dist/*.zip
