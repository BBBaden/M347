name: Top-Level-Ordner als ZIP (manuell + Release)

on:
  workflow_dispatch:

jobs:
  zip-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4

      - name: ZIPs für alle Top-Level-Ordner erstellen
        run: |
          for d in */ ; do
            case "$d" in
              ".git/"|".github/") continue ;;
            esac
            dirname="${d%/}"
            echo "Erstelle ZIP für: $dirname"
            zip -r "${dirname}.zip" "$dirname"
          done

      - name: ZIPs ans Release anhängen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: manual-zips
          name: "Manueller ZIP-Build"
          files: ./*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
