name: Build ZIPs (main + loesungen) and publish to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # main-Branch in ./main auschecken
      - name: Checkout aufgaben
        uses: actions/checkout@v4
        with:
          ref: aufgaben
          path: aufgaben

      # loesungen-Branch in ./loesungen auschecken
      - name: Checkout loesungen
        uses: actions/checkout@v4
        with:
          ref: loesungen
          path: loesungen

      - name: Create ZIPs for top-level folders (main + loesungen)
        run: |
          mkdir -p public

          # ZIPs aus main
          cd main
          for d in */ ; do
            case "$d" in
              ".git/"|".github/") continue ;;
            esac
            dirname="${d%/}"
            echo "Erstelle ZIP (main) für: $dirname"
            zip -r "../public/${dirname}_main.zip" "$dirname"
          done
          cd ..

          # ZIPs aus loesungen
          cd loesungen
          for d in */ ; do
            case "$d" in
              ".git/"|".github/") continue ;;
            esac
            dirname="${d%/}"
            echo "Erstelle ZIP (loesungen) für: $dirname"
            zip -r "../public/${dirname}_loesungen.zip" "$dirname"
          done
          cd ..

      - name: Create simple index.html
        run: |
          cd public
          cat > index.html <<'EOF'
          <!doctype html>
          <html lang="de">
          <head>
            <meta charset="utf-8">
            <title>M347 Downloads</title>
          </head>
          <body>
            <h1>M347 Downloads</h1>
            <ul>
          EOF
          for f in *.zip; do
            echo "<li><a href=\"$f\">$f</a></li>" >> index.html
          done
          cat >> index.html <<'EOF'
            </ul>
          </body>
          </html>
          EOF

      - name: Upload artifact for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
