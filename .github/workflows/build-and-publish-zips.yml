name: Build ZIPs and publish to GitHub Pages

on:
  workflow_dispatch:  # manueller Start per Button

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create ZIPs for top-level folders
        run: |
          mkdir -p public
          for d in */ ; do
            case "$d" in
              ".git/"|".github/"|"public/") continue ;;
            esac
            dirname="${d%/}"
            echo "Erstelle ZIP für: $dirname"
            zip -r "public/${dirname}.zip" "$dirname"
          done

      - name: Create simple index.html
        run: |
          cd public
          cat > index.html <<'EOF'
          <!doctype html>
          <html lang="de">
          <head>
            <meta charset="utf-8">
            <title>M347 Downloads</title>
          </head>
          <body>
            <h1>M347 Downloads</h1>
            <ul>
          EOF
          for f in *.zip; do
            echo "<li><a href=\"$f\">$f</a></li>" >> index.html
          done
          cat >> index.html <<'EOF'
            </ul>
          </body>
          </html>
          EOF

      - name: Upload artifact for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
